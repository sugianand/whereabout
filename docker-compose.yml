# Local development: API on :8000, web app on :3000.
#   docker compose up --build
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      WHEREABOUT_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"

  web:
    image: node:22-slim
    working_dir: /app/web
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
    depends_on:
      - api
