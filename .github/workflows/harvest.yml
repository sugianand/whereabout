name: Commons harvest

# Harvests new game photos from Wikimedia Commons (whereabout_ml.harvest): geotagged Quality
# and Featured images found near GeoNames places in every grid cell, checked for license,
# size, orientation and near-duplicates (ingest), screened by the CLIP scene gate with the
# calibrated thresholds, named from the GeoNames gazetteer and balanced across the grid.
# Commits data/harvest/ (candidate rows in photos.csv columns, provenance, every rejection and
# the counts per reason). Thumbnails and model weights stay on the runner.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Catalog size to grow towards (catalog photos plus harvested ones)"
        required: false
        default: "1000"
  push:
    branches: [main]
    paths:
      - "ml/src/whereabout_ml/harvest.py"
      - ".github/workflows/harvest.yml"

permissions:
  contents: write

concurrency:
  group: commons-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          # torch and torchvision must come from the same index, or their compiled ops disagree.
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e api -e eval -e "ml[clip,ingest]"

      - name: Download the GeoNames gazetteer (CC BY 4.0)
        run: |
          mkdir -p data/geonames
          curl -fsSL -o data/geonames/countryInfo.txt https://download.geonames.org/export/dump/countryInfo.txt
          curl -fsSL -o "$RUNNER_TEMP/cities15000.zip" https://download.geonames.org/export/dump/cities15000.zip
          unzip -o "$RUNNER_TEMP/cities15000.zip" -d data/geonames

      - name: Cache model weights and thumbnails
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .cache/harvest
          key: harvest-${{ hashFiles('ml/src/whereabout_ml/harvest.py') }}
          restore-keys: harvest-

      - name: Harvest
        shell: bash
        env:
          TARGET: ${{ inputs.target || '1000' }}
        run: |
          set -euo pipefail
          harvest-commons --gazetteer data/geonames \
            --catalog data/curation/photos.csv \
            --thresholds data/scene_gate/thresholds.json \
            --out-dir data/harvest --cache-dir .cache/harvest \
            --target "$TARGET"
          cat data/harvest/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/harvest/harvested.csv data/harvest/manifest.csv \
            data/harvest/rejected.csv data/harvest/report.json data/harvest/report.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(harvest): Commons harvest candidates and report"
          for attempt in 1 2 3; do
            git fetch --depth=50 origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "::error title=Could not push harvest results::rebase or push failed three times"
          exit 1
