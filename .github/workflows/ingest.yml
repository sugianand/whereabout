name: Ingest sample

# Runs the ingestion pipeline (whereabout_ml.ingest) on a small real sample: the catalog's
# Commons files. It captures each file's license and attribution from the Commons API, hashes
# a 330 px thumbnail and flags near-duplicates, then commits the manifest to data/ingest/.
# Thumbnails stay on the runner; only metadata and hashes are committed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ml/src/whereabout_ml/ingest.py"
      - "data/curation/photos.csv"
      - ".github/workflows/ingest.yml"

permissions:
  contents: write

concurrency:
  group: ingest-sample
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            eval/pyproject.toml
            ml/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e api -e eval -e "ml[ingest]"

      - name: Ingest the catalog's Commons files
        shell: bash
        run: |
          set -euo pipefail
          ingest-commons --catalog data/curation/photos.csv --out-dir data/ingest \
            --name sample --cache-dir "$RUNNER_TEMP/ingest"
          {
            echo "## Ingest sample"
            echo '```json'
            cat data/ingest/sample_manifest.meta.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ingest/sample_manifest.csv data/ingest/sample_rejected.csv \
            data/ingest/sample_manifest.meta.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(ingest): sample manifest from the Commons API"
          for attempt in 1 2 3; do
            git fetch --depth=50 origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "::error title=Could not push the ingest manifest::rebase or push failed three times"
          exit 1
