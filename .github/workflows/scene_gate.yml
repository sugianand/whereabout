name: Scene gate

# Calibrates the CLIP scene gate's thresholds: scores the hand-reviewed catalog photos and a
# small labelled fixture of reject photos (people, indoor, text, non-photos from Commons
# categories), then commits the thresholds and report (data/scene_gate/).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ml/src/whereabout_ml/scene_gate.py"
      - "ml/src/whereabout_ml/run_scene_gate.py"
      - "ml/src/whereabout_ml/reject_fixture.py"
      - "data/curation/photos.csv"
      - ".github/workflows/scene_gate.yml"

permissions:
  contents: write

concurrency:
  group: scene-gate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          # torch and torchvision must come from the same index, or their compiled ops disagree.
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e api -e eval -e "ml[clip]"

      - name: Cache model weights and images
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .cache/images
          key: scene-gate-${{ hashFiles('data/curation/photos.csv', 'data/scene_gate/rejects.csv') }}
          restore-keys: scene-gate-

      - name: Build the reject fixture (if missing)
        run: python -m whereabout_ml.reject_fixture --out data/scene_gate/rejects.csv

      - name: Calibrate the scene gate
        run: |
          python -m whereabout_ml.run_scene_gate \
            --catalog data/curation/photos.csv \
            --rejects data/scene_gate/rejects.csv \
            --images .cache/images \
            --out data/scene_gate
          cat data/scene_gate/report.md >> "$GITHUB_STEP_SUMMARY"

      # The "How Atlas guesses" page shows a summary of the report; keep it in step (a web test
      # fails if it drifts). The script needs only Node, which the runner already has.
      - name: Update the site's scene gate summary
        run: node web/scripts/build-scene-gate.mjs

      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scene_gate/ web/src/data/scene_gate.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(scene-gate): calibrated thresholds and report"
          for attempt in 1 2 3; do
            git fetch --depth=50 origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "::error title=Could not push scene-gate results::rebase or push failed three times"
          exit 1
