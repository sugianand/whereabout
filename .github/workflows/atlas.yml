name: Atlas v0

# Runs zero-shot CLIP geolocation over the photo catalog on a CPU runner, compares two models
# against baselines, and commits Atlas's guesses (web/src/data/atlas.json) and the results
# (eval/results/). This is the offline "cold path" from docs/architecture.md: the model runs
# here, once, and the game ships its answers.
#
# It also tries a retrieval refinement (whereabout_ml.retrieval) over geotagged reference photos
# from Commons that are never game photos (whereabout_ml.reference_set, data/reference/). The
# refined Atlas is scored next to the others and plays only if it clearly beats the unrefined one.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ml/src/**"
      - "eval/src/**"
      - "data/curation/photos.csv"
      - ".github/workflows/atlas.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: atlas
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Occlusion maps cost ~50 forward passes per new photo; cached ones are free. The first run
    # on the 238-photo catalog spent 116 minutes in "Run Atlas v0" alone, so new maps now get a
    # time budget (below) and the rest wait for the next run. Image embeddings are cached too:
    # encoding the 388-photo catalog with all three models took most of a 22-minute step.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          # torch and torchvision must come from the same index, or their compiled ops disagree.
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e api -e eval -e "ml[clip]"

      - name: Cache model weights and photos
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .cache/images
          key: atlas-${{ hashFiles('data/curation/photos.csv') }}
          restore-keys: atlas-

      # Saliency maps get their own cache with a per-run key, so maps computed in this run are
      # always saved (a cache whose key already exists is never re-saved). They are saved even
      # when a later step fails, so an expensive run is not lost to a failing test.
      - name: Restore saliency maps
        uses: actions/cache/restore@v4
        with:
          path: .cache/saliency
          key: saliency-${{ github.run_id }}
          restore-keys: saliency-

      # Same pattern for image embeddings (whereabout_ml.embedding_cache): keyed per model,
      # photo and image bytes, so each run only encodes the photos it has not seen.
      - name: Restore image embeddings
        uses: actions/cache/restore@v4
        with:
          path: .cache/embeddings
          key: embeddings-${{ github.run_id }}
          restore-keys: embeddings-

      # Reference thumbnails, same per-run pattern: a time budget fetches some each run and the
      # cache carries them to the next, so the set fills in without one long run.
      - name: Restore reference thumbnails
        uses: actions/cache/restore@v4
        with:
          path: .cache/references
          key: references-${{ github.run_id }}
          restore-keys: references-

      - name: Download the GeoNames gazetteer (CC BY 4.0)
        run: |
          mkdir -p data/geonames
          curl -fsSL -o data/geonames/countryInfo.txt https://download.geonames.org/export/dump/countryInfo.txt
          curl -fsSL -o /tmp/cities15000.zip https://download.geonames.org/export/dump/cities15000.zip
          unzip -o /tmp/cities15000.zip -d data/geonames

      # The list is searched on Commons once and committed (data/reference/references.csv); later
      # runs reuse it and only fetch missing thumbnails. If Commons is unreachable, Atlas v0 still
      # runs, with whatever reference thumbnails earlier runs cached.
      - name: Collect reference photos for retrieval
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          reference-set \
            --gazetteer data/geonames \
            --exclude data/curation/photos.csv \
            --exclude data/harvest/harvested.csv \
            --out data/reference/references.csv \
            --images .cache/references \
            --budget-minutes 30 | tee references.log
          grep "^reference" references.log | sed 's/^/::notice title=Reference photos::/' || true
          left=$(sed -n 's/^reference thumbnails: .*, \([0-9]*\) left for a later run$/\1/p' references.log)
          echo "references_left=${left:-0}" >> "$GITHUB_ENV"

      - name: Run Atlas v0
        shell: bash
        run: |
          set -o pipefail
          # Annotations are readable through the API even where raw logs aren't, so failures
          # and results are reported as annotations too.
          annotate() { python3 -c 'import sys; t=sys.stdin.read()[-3500:]; print(t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'; }
          retrieval=()
          if [ -f data/reference/references.csv ]; then
            # Image similarity from the cheapest model: reference thumbnails are encoded once.
            retrieval=(--references data/reference/references.csv
                       --reference-images .cache/references
                       --retrieval-model ViT-B-32:laion2b_s34b_b79k)
          fi
          if ! atlas-v0 \
              --catalog data/curation/photos.csv \
              --gazetteer data/geonames \
              --images .cache/images \
              --atlas-out web/src/data/atlas.json \
              --results-dir eval/results \
              --embedding-cache .cache/embeddings \
              --saliency-budget-minutes 90 \
              --model ViT-B-32:laion2b_s34b_b79k \
              --model ViT-B-32:openai \
              --model ViT-L-14:openai \
              "${retrieval[@]}" 2> >(tee atlas-stderr.log >&2) | tee atlas-stdout.log; then
            echo "::error title=Atlas v0 failed::$(annotate < atlas-stderr.log)"
            exit 1
          fi
          cat eval/results/atlas-v0.md >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Atlas v0 results::$(annotate < eval/results/atlas-v0.md)"
          if grep -q "^skipping" atlas-stderr.log; then
            echo "::warning title=Photos skipped::$(grep '^skipping' atlas-stderr.log | annotate)"
          fi
          if grep -q "^saliency failed" atlas-stderr.log; then
            echo "::warning title=Saliency failed::$(grep -A3 '^saliency failed' atlas-stderr.log | annotate)"
          fi
          grep "^saliency:" atlas-stdout.log | sed 's/^/::notice title=Saliency::/' || true
          grep "photos in .* from the embedding cache" atlas-stdout.log \
            | sed 's/^/::notice title=Embeddings::/' || true
          grep -E "^(references|retrieval):" atlas-stdout.log | sed 's/^/::notice title=Retrieval::/' || true
          # Maps the budget left for later: another run picks them up once this one has pushed.
          left=$(sed -n 's/^saliency: .*; \([0-9]*\) left for a later run$/\1/p' atlas-stdout.log)
          echo "saliency_left=${left:-0}" >> "$GITHUB_ENV"

      - name: Save saliency maps
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/saliency
          key: saliency-${{ github.run_id }}

      - name: Save image embeddings
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/embeddings
          key: embeddings-${{ github.run_id }}

      - name: Save reference thumbnails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/references
          key: references-${{ github.run_id }}

      # Pocket Atlas: the text half of the ViT-B/32 (OpenAI) pipeline, scored above as
      # "ViT-B-32/openai, country then city", precomputed for the browser. One catalog photo's
      # PyTorch embedding goes in too, for the parity test below.
      - name: Build Pocket Atlas's text index
        shell: bash
        run: |
          set -euo pipefail
          # A glob, not `ls | head -1`: with enough photos head exits first, ls gets SIGPIPE and
          # pipefail fails the step (it did at 388 photos).
          images=(.cache/images/*.jpg)
          parity="${images[0]}"
          echo "POCKET_PARITY_IMAGE=$PWD/$parity" >> "$GITHUB_ENV"
          pocket-atlas-index --gazetteer data/geonames --out web/public/pocket-atlas \
            --model ViT-B-32:openai --parity-image "$parity" | tee pocket.log
          echo "::notice title=Pocket Atlas index::$(tail -1 pocket.log)"

      # The bot's push won't trigger CI, so check here that the game still passes, type-checks
      # and builds with the new guesses before committing them.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test the game with the new guesses
        working-directory: web
        run: |
          npm ci
          npm test
          npm run typecheck
          NEXT_PUBLIC_BASE_PATH=/whereabout npm run build

      # Real Chromium, real model weights from the Hub: does the browser's image encoder agree
      # with PyTorch's on the same photo? If not, the index is not shipped (the guesses still are).
      - name: Pocket Atlas parity (browser vs PyTorch)
        id: parity
        continue-on-error: true
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test e2e/pocket.spec.ts --project=desktop
          echo "::notice title=Pocket Atlas parity::$(tr -d '\n' < test-results/pocket-parity.json)"
          cp test-results/pocket-parity.json ../eval/results/pocket-parity.json

      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/data/atlas.json eval/results/
          if [ -f data/reference/references.csv ]; then
            git add data/reference/references.csv
          fi
          if [ "${{ steps.parity.outcome }}" = "success" ]; then
            git add web/public/pocket-atlas/
          else
            echo "::warning title=Pocket Atlas not shipped::the parity test failed; see its step"
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(atlas): Atlas v0 guesses and evaluation results"
          for attempt in 1 2 3; do
            git fetch --depth=50 origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "::error title=Could not push Atlas results::rebase or push failed three times"
          exit 1

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so redeploy explicitly, and
      # queue another Atlas run while the saliency budget left photos without a map, or the
      # reference budget left thumbnails to fetch (each run does a budget's worth, so this ends
      # once every photo has a map and every reference a thumbnail).
      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          if [ "${saliency_left:-0}" -gt 0 ] || [ "${references_left:-0}" -gt 0 ]; then
            echo "::notice title=Another run::${saliency_left:-0} photos still need a map, ${references_left:-0} reference thumbnails still to fetch; queued another Atlas run"
            gh workflow run atlas.yml --ref main
          fi
