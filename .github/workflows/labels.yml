name: Concept labels

# Downloads the real Köppen-Geiger climate map and the ESA WorldCover tiles the catalog needs,
# checks known places against them, and commits the catalog's concept labels
# (data/labels/concept_labels.csv). The maps are several GB and never committed; the run only
# repeats when the catalog, the known places or the labelling code change.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ml/src/whereabout_ml/maps.py"
      - "ml/src/whereabout_ml/labels.py"
      - "ml/src/whereabout_ml/concept_labels.py"
      - "data/curation/photos.csv"
      - "data/fixtures/concept_places.json"
      - ".github/workflows/labels.yml"

permissions:
  contents: write

concurrency:
  group: concept-labels
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            eval/pyproject.toml
            ml/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e api -e eval -e "ml[maps]"

      - name: Download maps, check known places, label the catalog
        shell: bash
        run: |
          set -o pipefail
          df -h . | tail -1
          annotate() { python3 -c 'import sys; t=sys.stdin.read()[-3500:]; print(t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'; }
          if ! concept-labels \
              --catalog data/curation/photos.csv \
              --maps-dir data/maps \
              --known-places data/fixtures/concept_places.json \
              --out data/labels/concept_labels.csv \
              --download 2> >(tee labels-stderr.log >&2) | tee labels-stdout.log; then
            grep '^|' labels-stdout.log >> "$GITHUB_STEP_SUMMARY" || true
            echo "::error title=Concept labels failed::$(annotate < labels-stderr.log)"
            exit 1
          fi
          {
            echo "## Known places read from the real maps"
            grep '^|' labels-stdout.log
            echo
            echo '```json'
            cat data/labels/concept_labels.meta.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Concept labels::$(annotate < data/labels/concept_labels.meta.json)"

      # The site's catalog (web/src/data/photos.json) carries each photo's driving side and
      # climate group for the in-game hints; keep it in step (a web test fails if it drifts).
      - name: Update the site's catalog
        run: node web/scripts/build-catalog.mjs

      - name: Commit labels
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/labels/concept_labels.csv data/labels/concept_labels.meta.json \
            web/src/data/photos.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(labels): catalog concept labels from the real maps"
          for attempt in 1 2 3; do
            git fetch --depth=50 origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "::error title=Could not push labels::rebase or push failed three times"
          exit 1
