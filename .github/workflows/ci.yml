name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: api, eval, ml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            eval/pyproject.toml
            ml/pyproject.toml
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Type-check
        run: npm run typecheck

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f api/Dockerfile -t whereabout-api .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 whereabout-api
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs -X POST localhost:8000/api/v1/rounds | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['photo']['image_url'].startswith('https://'); print('round ok')"

  e2e:
    name: end-to-end (real browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /whereabout
      - name: Play the game in a browser
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
