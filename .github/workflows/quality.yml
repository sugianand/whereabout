name: Photo quality

# Measures every catalog photo's original resolution and sharpness (Commons API plus a 1920 px
# analysis image) and commits data/curation/quality.csv.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/curation/photos.csv"
      - "ml/src/whereabout_ml/photo_quality.py"
      - ".github/workflows/quality.yml"

permissions:
  contents: write

concurrency:
  group: photo-quality
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e api -e eval -e "ml[ingest]"

      - name: Cache analysis images
        uses: actions/cache@v4
        with:
          path: .cache/quality
          key: quality-${{ hashFiles('data/curation/photos.csv') }}
          restore-keys: quality-

      - name: Measure photo quality
        run: |
          python -m whereabout_ml.photo_quality \
            --catalog data/curation/photos.csv \
            --out data/curation/quality.csv \
            --cache .cache/quality | tee quality_summary.txt
          sed -n '/^## Photo quality/,$p' quality_summary.txt >> "$GITHUB_STEP_SUMMARY"
          rm quality_summary.txt

      # The site's catalog (web/src/data/photos.json) carries each photo's measured size; keep it
      # in step (a web test fails if it drifts). The script needs only Node, which the runner has.
      - name: Update the site's catalog
        run: node web/scripts/build-catalog.mjs

      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curation/quality.csv web/src/data/photos.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(quality): measured photo resolution and sharpness"
          for attempt in 1 2 3; do
            git fetch --depth=50 origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "::error title=Could not push quality results::rebase or push failed three times"
          exit 1
